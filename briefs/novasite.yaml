price: null
currency: ZAR
price_unit: varies by offer; see description
target_market: |
  Owners, founders and managing directors of South African businesses with
  1–100 staff, especially in mining support, construction, industrial supply,
  IT, medical training, retail and services. They usually make the purchase
  decision. Owners, office managers and administrative staff use the websites
  or systems to manage bookings, quotes and enquiries. Separate businesses
  seeking a basic website from businesses seeking a custom operational app.
region: South Africa, primarily Pretoria, Johannesburg and Centurion in Gauteng; international demand is secondary and owner-reported.
competitors:
  - Local web development agencies and freelancers (specific suppliers not yet identified)
  - Wix
  - WordPress templates and associated hosting or development services
  - Google Sites
  - Off-the-shelf booking software (specific products not yet identified)
  - WhatsApp, Facebook pages, word of mouth, paper diaries and Excel
  - Keeping the existing website or doing nothing
questions:
  - For a defined booking system or business dashboard, would you choose an upfront project fee or a monthly build, hosting and support plan, and why? Specify required scope, acceptable terms and ZAR price expectations separately for each option.
  - After a free website and first year of hosting, SSL and maintenance, what would justify paying R1,000/month? What inclusions, lower monthly price or annual payment option would change your decision?
  - Would you choose a free website with later recurring fees or a low-cost paid website package with transparent ongoing costs? Explain trust concerns, budget and conditions for committing.
  - What do you currently spend on websites, booking tools and administration, who approves the purchase, and what specific event would prompt you to switch?
  - Which single service would you buy first, what measurable outcome would justify its cost, and what evidence would you need before paying?
